<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>e-Arsip Surat</title>

  <!-- Tema tersimpan diterapkan lebih awal agar tidak berkedip -->
  <script>
    try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
  </script>

  <!-- Font & ikon (sesuai DESIGN.md: Plus Jakarta Sans + Material Symbols) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet">

  <!-- Tailwind (utility styling) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Semua warna dibaca dari CSS variable (rgb channel) -> otomatis ikut mode gelap & mendukung opacity (bg-primary/20)
    const TOKENS = ["surface","surface-dim","surface-bright","surface-container-lowest","surface-container-low","surface-container","surface-container-high","surface-container-highest","on-surface","on-surface-variant","inverse-surface","inverse-on-surface","outline","outline-variant","surface-tint","primary","on-primary","primary-container","on-primary-container","inverse-primary","secondary","on-secondary","secondary-container","on-secondary-container","tertiary","on-tertiary","tertiary-container","on-tertiary-container","error","on-error","error-container","on-error-container","primary-fixed","primary-fixed-dim","on-primary-fixed","on-primary-fixed-variant","secondary-fixed","secondary-fixed-dim","on-secondary-fixed","on-secondary-fixed-variant","tertiary-fixed","tertiary-fixed-dim","on-tertiary-fixed","on-tertiary-fixed-variant","background","on-background","surface-variant","canvas-bg","surface-card","border-subtle","border-focus","sidebar-bg","sidebar-active","text-primary","text-secondary","text-muted","status-success-bg","status-success-text","status-warning-bg","status-warning-text","status-danger-bg","status-danger-text","status-info-bg","status-info-text"];
    const colors = {};
    TOKENS.forEach(t => colors[t] = 'rgb(var(--c-' + t + ') / <alpha-value>)');
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: colors,
        borderRadius: { DEFAULT: '0.25rem', lg: '0.5rem', xl: '0.75rem', full: '9999px' },
        spacing: { 'space-xs': '0.25rem', 'space-sm': '0.5rem', 'space-md': '1rem', 'space-lg': '1.5rem', 'space-xl': '2rem',
                   gutter: '1.25rem', 'gutter-sm': '0.75rem', margin: '1.5rem', 'margin-mobile': '1rem' },
        fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] },
        fontSize: {
          'display-lg': ['30px', { lineHeight: '38px', fontWeight: '700' }],
          'headline-lg': ['24px', { lineHeight: '32px', fontWeight: '700' }],
          'headline-lg-mobile': ['20px', { lineHeight: '28px', fontWeight: '700' }],
          'headline-md': ['18px', { lineHeight: '26px', fontWeight: '600' }],
          'headline-sm': ['16px', { lineHeight: '24px', fontWeight: '600' }],
          'body-lg': ['15px', { lineHeight: '22px', fontWeight: '400' }],
          'body-md': ['14px', { lineHeight: '20px', fontWeight: '400' }],
          'body-sm': ['12px', { lineHeight: '18px', fontWeight: '400' }],
          'label-lg': ['14px', { lineHeight: '20px', fontWeight: '600' }],
          'label-md': ['12px', { lineHeight: '16px', fontWeight: '600' }],
          'label-sm': ['11px', { lineHeight: '14px', letterSpacing: '0.04em', fontWeight: '700' }]
        }
      } }
    };
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="javascript:void(0)" class="skip-link" data-act="skip">Lewati ke konten utama</a>

  <!-- Overlay muat awal -->
  <div id="loadingOverlay" role="status" aria-live="polite">
    <span class="spin" style="width:32px;height:32px;border-width:3px;color:rgb(var(--c-primary-container))"></span>
    <p class="text-body-md">Memuat e-Arsip Surat…</p>
  </div>

  <!-- Tampilan login (sebelum masuk) -->
  <div id="login-view" class="hidden min-h-screen"></div>

  <!-- Shell aplikasi (muncul setelah login) -->
  <div id="shell" class="hidden">
    <div id="sidebar-scrim" class="fixed inset-0 bg-black/50 z-40 lg:hidden" data-act="close-nav"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-sidebar-bg z-50 flex flex-col justify-between" aria-label="Navigasi utama">
      <div class="flex flex-col min-h-0">
        <div class="h-16 px-space-md flex items-center gap-space-sm bg-primary-container/30 flex-shrink-0">
          <div id="brand-logo" class="w-9 h-9 rounded-lg bg-white/15 flex items-center justify-center flex-shrink-0 overflow-hidden">
            <span class="material-symbols-outlined text-on-primary ms-fill" aria-hidden="true">inventory_2</span>
          </div>
          <div class="flex flex-col leading-tight min-w-0">
            <span id="brand-name" class="text-headline-sm text-on-primary truncate">e-Arsip Surat</span>
            <span id="brand-sub" class="text-label-sm text-primary-fixed truncate">Tata Usaha &amp; Kearsipan</span>
          </div>
        </div>
        <nav id="nav" class="px-space-sm pt-space-sm flex flex-col gap-1 overflow-y-auto" aria-label="Menu"></nav>
      </div>
      <div class="p-space-sm flex flex-col gap-space-sm">
        <div class="rounded-lg bg-tertiary-container/40 p-space-sm flex flex-col gap-1">
          <div class="flex items-center gap-1.5">
            <span class="material-symbols-outlined text-primary-fixed" style="font-size:16px" aria-hidden="true">domain</span>
            <span class="text-label-sm uppercase text-primary-fixed-dim">Unit Kerja</span>
          </div>
          <p id="brand-unit" class="text-label-md text-on-primary leading-tight">—</p>
        </div>
      </div>
    </aside>

    <div class="lg:pl-64">
      <!-- Top bar -->
      <header id="topbar" class="fixed top-0 left-0 lg:left-64 right-0 h-16 bg-surface-card/90 backdrop-blur-xl border-b border-border-subtle z-30 flex items-center justify-between gap-2 px-space-md lg:px-space-lg">
        <div class="flex items-center gap-2 flex-1 min-w-0">
          <button class="btn-icon lg:hidden" data-act="open-nav" aria-label="Buka menu"><span class="material-symbols-outlined">menu</span></button>
          <form id="global-search" class="relative w-full max-w-lg" role="search">
            <label for="q-global" class="sr-only">Cari surat</label>
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted" style="font-size:20px" aria-hidden="true">search</span>
            <input id="q-global" class="w-full pl-10 pr-4 sm:pr-16 py-2 rounded-lg bg-canvas-bg text-body-sm text-text-primary placeholder:text-text-muted border border-transparent focus:border-border-focus focus:ring-2 focus:ring-border-focus/20 outline-none" style="min-height:40px" placeholder="Cari nomor surat, perihal, pengirim…" autocomplete="off">
            <span class="hidden sm:block absolute right-3 top-1/2 -translate-y-1/2 px-1.5 py-0.5 rounded bg-surface-container-high text-on-surface-variant text-label-sm" aria-hidden="true">Ctrl K</span>
          </form>
        </div>
        <div class="flex items-center gap-1 sm:gap-2">
          <div class="hidden xl:flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-surface-container-low text-text-secondary text-label-md">
            <span class="material-symbols-outlined text-primary" style="font-size:18px" aria-hidden="true">calendar_today</span>
            <span id="today-label"></span>
          </div>
          <button class="btn-icon" data-act="toggle-theme" aria-label="Ganti mode terang atau gelap"><span id="theme-icon" class="material-symbols-outlined">dark_mode</span></button>
          <div class="h-6 w-px bg-border-subtle hidden sm:block"></div>
          <div class="relative">
            <button class="flex items-center gap-2 pl-1 pr-1 sm:pr-2 py-1 rounded-lg hover:bg-surface-container-low" data-act="toggle-profile" aria-haspopup="true" aria-expanded="false" aria-controls="profile-menu" style="min-height:44px">
              <span id="avatar" class="w-8 h-8 rounded-full bg-primary-container text-on-primary flex items-center justify-center text-label-lg">?</span>
              <span class="hidden md:flex flex-col text-left leading-tight">
                <span id="user-name" class="text-label-md text-text-primary">—</span>
                <span id="user-role" class="text-body-sm text-text-secondary">—</span>
              </span>
              <span class="material-symbols-outlined text-text-muted hidden sm:block" aria-hidden="true">expand_more</span>
            </button>
            <div id="profile-menu" class="hidden absolute right-0 top-full mt-2 w-56 card p-1 z-50" role="menu">
              <button class="nav-item !text-text-primary hover:!bg-surface-container-low hover:!text-text-primary" role="menuitem" data-act="ganti-pin"><span class="flex items-center gap-2"><span class="material-symbols-outlined" aria-hidden="true">key</span>Ganti PIN</span></button>
              <button class="nav-item !text-text-primary hover:!bg-surface-container-low hover:!text-text-primary" role="menuitem" data-act="logout"><span class="flex items-center gap-2"><span class="material-symbols-outlined" aria-hidden="true">logout</span>Keluar</span></button>
            </div>
          </div>
        </div>
      </header>

      <!-- Konten utama: seluruh halaman SPA disuntikkan di sini (URL tidak pernah berubah) -->
      <main id="mainContent" class="pt-16 min-h-screen" tabindex="-1">
        <div id="app-container" class="px-space-md py-space-md lg:px-space-lg lg:py-space-lg pb-16"></div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>

  <!-- Chart.js & pdf.js (pratinjau PDF) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- Konfigurasi alamat backend, lalu logika aplikasi -->
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
